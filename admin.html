<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель — ГСИ</title>
    <script src="https://cdn.tiny.cloud/1/4z9xpqygnhcayny2cu3oy3k4w2kzd7rnxuonkpnqujxvcksx/tinymce/8/tinymce.min.js" referrerpolicy="origin"></script>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: Arial, sans-serif; background: #f5f6f8; color: #263238; }
        .login { min-height: 100vh; display: grid; place-items: center; padding: 20px; }
        .login-card, .editor-card { background: #fff; border-radius: 10px; box-shadow: 0 3px 18px rgba(0,0,0,.08); }
        .login-card { width: min(100%, 400px); padding: 32px; }
        h1, h2 { margin-top: 0; }
        label { display: block; margin: 14px 0 6px; font-weight: 600; }
        input { width: 100%; padding: 11px; border: 1px solid #ccd3da; border-radius: 5px; font-size: 16px; }
        button { border: 0; border-radius: 5px; padding: 11px 18px; cursor: pointer; font-size: 14px; }
        .primary { background: #1677d2; color: #fff; }
        .success { background: #209b57; color: #fff; }
        .muted { background: #87929d; color: #fff; }
        .danger { background: #d64545; color: #fff; }
        .login button { width: 100%; margin-top: 20px; }
        .error { color: #b42318; margin-top: 12px; }
        .panel { display: none; }
        header { background: #263746; color: #fff; padding: 18px 30px; display: flex; justify-content: space-between; align-items: center; }
        header h1 { margin: 0; font-size: 21px; }
        main { max-width: 1300px; margin: 30px auto; padding: 0 20px; }
        .pages { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 18px; }
        .page { background: #fff; border-radius: 8px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
        .page h3 { margin: 0 0 8px; }
        .page p { color: #65717b; min-height: 40px; }
        .page button { width: 100%; }
        .editor-card { display: none; margin-top: 25px; padding: 24px; }
        .editor-top { display: flex; gap: 14px; align-items: center; justify-content: space-between; flex-wrap: wrap; border-bottom: 1px solid #e7eaed; padding-bottom: 18px; margin-bottom: 18px; }
        .actions { display: flex; gap: 8px; }
        .file { background: #f1f5f8; padding: 10px 12px; border-left: 4px solid #1677d2; margin-bottom: 16px; }
        .notice { margin-top: 14px; padding: 12px; background: #fff7d6; border: 1px solid #ead58a; color: #695400; }
    </style>
</head>
<body>
    <section class="login" id="loginView">
        <form class="login-card" id="loginForm">
            <h2>Вход в админ-панель</h2>
            <label for="username">Логин</label>
            <input id="username" autocomplete="username" required>
            <label for="password">Пароль</label>
            <input id="password" type="password" autocomplete="current-password" required>
            <button class="primary" type="submit">Войти</button>
            <div class="error" id="loginError"></div>
        </form>
    </section>

    <section class="panel" id="panelView">
        <header>
            <h1>Админ-панель ГСИ</h1>
            <button class="danger" id="logout">Выйти</button>
        </header>
        <main>
            <div id="pagesView">
                <h2>Страницы сайта</h2>
                <div class="pages" id="pages"></div>
            </div>
            <div class="editor-card" id="editorView">
                <div class="editor-top">
                    <h2 id="editorTitle">Редактирование</h2>
                    <div class="actions">
                        <button class="success" id="save">Скачать HTML</button>
                        <button class="muted" id="cancel">Отмена</button>
                    </div>
                </div>
                <div class="file">Файл: <span id="fileName"></span></div>
                <textarea id="pageEditor"></textarea>
                <div class="notice">В этой статической версии кнопка скачивает измененный HTML-файл. Для автоматического сохранения на сервере нужен серверный обработчик и авторизация.</div>
            </div>
        </main>
    </section>

    <script>
        const CONFIG = {
            username: 'admin',
            password: 'gsi2026',
            pages: [
                ['index.html', 'Главная страница', 'Подбор оборудования и способы съемки'],
                ['solutions.html', 'Решения', 'Варианты решений для разных задач'],
                ['laser-scanning.html', 'Лазерное сканирование', 'Наземное лазерное сканирование'],
                ['goslam.html', 'GoSLAM', 'Мобильное лазерное сканирование'],
                ['t300-pro.html', 'T300 Pro', 'Характеристики сканера T300 Pro'],
                ['scan-to-bim-workflow.html', 'Scan-to-BIM', 'Пример проверки BIM-модели']
            ]
        };
        let currentFile = '';

        tinymce.init({
            selector: '#pageEditor',
            height: 620,
            language: 'ru',
            menubar: true,
            branding: false,
            plugins: 'anchor autolink charmap code image link lists media searchreplace table visualblocks wordcount',
            toolbar: 'undo redo | blocks fontsize | bold italic underline | alignleft aligncenter alignright | bullist numlist | link image table | code removeformat',
            content_style: 'body { font-family: Arial, sans-serif; font-size: 16px; }'
        });

        const $ = id => document.getElementById(id);
        function showPanel() { $('loginView').style.display = 'none'; $('panelView').style.display = 'block'; renderPages(); }
        function renderPages() {
            $('pages').innerHTML = CONFIG.pages.map(([file, title, desc]) => `
                <article class="page"><h3>${title}</h3><p>${desc}</p><small>${file}</small><br><br>
                <button class="primary" data-file="${file}" data-title="${title}">Редактировать</button></article>`).join('');
            document.querySelectorAll('[data-file]').forEach(button => button.addEventListener('click', () => editPage(button.dataset.file, button.dataset.title)));
        }
        async function editPage(file, title) {
            try {
                const response = await fetch(file, { cache: 'no-store' });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const content = await response.text();
                currentFile = file;
                $('editorTitle').textContent = `Редактирование: ${title}`;
                $('fileName').textContent = file;
                $('pagesView').style.display = 'none';
                $('editorView').style.display = 'block';
                tinymce.get('pageEditor').setContent(content);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } catch (error) { alert('Не удалось загрузить файл: ' + error.message); }
        }
        $('loginForm').addEventListener('submit', event => {
            event.preventDefault();
            if ($('username').value === CONFIG.username && $('password').value === CONFIG.password) {
                sessionStorage.setItem('adminLoggedIn', 'true'); $('loginError').textContent = ''; showPanel();
            } else $('loginError').textContent = 'Неверный логин или пароль';
        });
        $('logout').addEventListener('click', () => { sessionStorage.removeItem('adminLoggedIn'); location.reload(); });
        $('cancel').addEventListener('click', () => { $('editorView').style.display = 'none'; $('pagesView').style.display = 'block'; currentFile = ''; });
        $('save').addEventListener('click', () => {
            if (!currentFile) return;
            const blob = new Blob([tinymce.get('pageEditor').getContent()], { type: 'text/html;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a'); link.href = url; link.download = currentFile; link.click();
            URL.revokeObjectURL(url);
        });
        if (sessionStorage.getItem('adminLoggedIn') === 'true') showPanel();
    </script>
</body>
</html>
